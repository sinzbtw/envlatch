name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Python lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements/requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  coverage:
    name: Branch coverage including CLI subprocesses
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: ${{ github.workspace }}/.coverage
      COVERAGE_RCFILE: ${{ github.workspace }}/pyproject.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e . -r requirements/requirements-dev.txt
      - run: python -m coverage run -m unittest discover -s tests -q
      - run: python -m coverage combine
      - name: Create downloadable coverage reports
        run: |
          python -m coverage html --fail-under=0
          python -m coverage xml --fail-under=0
      - name: Write coverage summary and enforce the threshold
        shell: bash
        run: |
          echo '## EnvLatch test coverage' >> "$GITHUB_STEP_SUMMARY"
          echo 'Includes branch coverage and CLI subprocesses.' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report -m | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Store HTML and XML reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          if-no-files-found: warn
          retention-days: 14

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 2
    groups:
      development-tools:
        patterns: ['*']
        update-types: [minor, patch]
